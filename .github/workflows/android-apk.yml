name: Android APK

on:
  push:
    paths:
      - 'pokeplatinum-android-source.zip.t0.002'
      - 'assemble-source-bundle.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: python3 assemble-source-bundle.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android and native build tools
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm gcc-arm-none-eabi binutils-arm-none-eabi
          python3 -m pip install --user --break-system-packages 'meson>=1.12'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Correct NDK toolchain path in bundled source
        run: |
          sed -i 's|$TOOLCHAIN/build/cmake/android.toolchain.cmake|$NDK/build/cmake/android.toolchain.cmake|g' \
            _source/pokeplatinum-pcport-source/tools/android/build-native.sh
          sed -i "s/\['c', 'cpp', 'nasm'\]/['c', 'cpp']/" \
            _source/pokeplatinum-pcport-source/meson.build
          sed -i "s/'c', 'cpp', 'nasm'/'c', 'cpp'/" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/meson.build
          sed -i "s/include_directories: include_directories(sdl2_include_dir)/compile_args: ['-I' + sdl2_include_dir]/; s/include_directories: include_directories(enet_include_dir)/compile_args: ['-I' + enet_include_dir]/" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/libraries/sim/meson.build
      - name: Compile APK
        run: gradle -p _source/pokeplatinum-pcport-source/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Platinum-Android-debug
          path: _source/pokeplatinum-pcport-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
