name: Android APK

on:
  push:
    paths:
      - 'pokeplatinum-android-source.zip.t0.002'
      - 'assemble-source-bundle.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: python3 assemble-source-bundle.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android and native build tools
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev pkg-config
          python3 -m pip install --user --break-system-packages 'meson>=1.12'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Correct NDK toolchain path in bundled source
        run: |
          root='_source/pokeplatinum-pcport-source'
          for project in libntrsystem libntrwifi libntrdwc libvct; do
            git clone --depth 1 "https://github.com/cybervisi0n/$project.git" "$root/subprojects/$project"
          done
          sed -i 's|$TOOLCHAIN/build/cmake/android.toolchain.cmake|$NDK/build/cmake/android.toolchain.cmake|g' \
            _source/pokeplatinum-pcport-source/tools/android/build-native.sh
          sed -i "s|c_args = \['-fPIC'\]|c_args = ['-fPIC', '-I\$SDL_INCLUDE_DIR', '-I\$ENET_PREFIX/include']|; s|cpp_args = \['-fPIC'\]|cpp_args = ['-fPIC', '-I\$SDL_INCLUDE_DIR', '-I\$ENET_PREFIX/include']|" \
            _source/pokeplatinum-pcport-source/tools/android/build-native.sh
          sed -i '/^#define NITRO_H_$/a\
          #if defined(SDK_BUILD_ANDROID)\
          #define ATTRIBUTE_ALIGN(x) __attribute__((aligned(x)))\
          #endif' _source/pokeplatinum-pcport-source/subprojects/libntr/include/nitro.h
          sed -i "s/\['c', 'cpp', 'nasm'\]/['c', 'cpp']/" \
            _source/pokeplatinum-pcport-source/meson.build
          sed -i "s/'c', 'cpp', 'nasm'/'c', 'cpp'/" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/meson.build
          sed -i "s/include_directories: include_directories(sdl2_include_dir)/compile_args: ['-I' + sdl2_include_dir]/; s/include_directories: include_directories(enet_include_dir)/compile_args: ['-I' + enet_include_dir]/" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/libraries/sim/meson.build
          sed -i -E "s/meson.get_external_property\(('sdl2_lib_dir'|'enet_lib_dir'|'sdl2_include_dir'|'enet_include_dir')\)/meson.get_external_property(\1, native: false)/g" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/libraries/sim/meson.build
          sed -i "s/if (build_target != 'arm')/if (build_target != 'arm' and meson.get_external_property('sdl2_lib_dir', '') != '')/" \
            _source/pokeplatinum-pcport-source/subprojects/libntr/libraries/meson.build
          python3 - <<'PY'
          from pathlib import Path
          root = Path('_source/pokeplatinum-pcport-source')
          for base in ('lib', 'subprojects/libntr/libraries', 'subprojects/libntrsystem', 'subprojects/libntrwifi', 'subprojects/libntrdwc', 'subprojects/libvct'):
              for path in (root / base).rglob('meson.build'):
                  source = path.read_text()
                  source = source.replace("pic: false", "pic: (build_target == 'android')")
                  source = source.replace("pic: build_target == 'nx'", "pic: (build_target == 'nx' or build_target == 'android')")
                  source = source.replace("pic: (build_target == 'nx')", "pic: (build_target == 'nx' or build_target == 'android')")
                  path.write_text(source)
          PY
      - name: Restore omitted source assets
        run: |
          upstream='https://raw.githubusercontent.com/pret/pokeplatinum/c248fb3f8cc9934ded800e489567c5c0eeee92eb'
          root='_source/pokeplatinum-pcport-source'
          model_dir="$root/res/prebuilt/fielddata/build_model"
          mkdir -p "$model_dir"
          curl -fsSL --retry 3 "$upstream/res/prebuilt/fielddata/build_model/meson.build" -o "$model_dir/meson.build"
          curl -fsSL --retry 3 "$upstream/res/prebuilt/fielddata/build_model/build_model_matshp.dat" -o "$model_dir/build_model_matshp.dat"
          curl -fsSL --retry 3 "$upstream/res/graphics/field_sprites/frame_sequences/save.bin" -o "$root/res/graphics/field_sprites/frame_sequences/save.bin"
          test "$(git hash-object "$model_dir/meson.build")" = 5b48e4fb3257cc74a8323a4db9e64f6eba3b7a30
          test "$(git hash-object "$model_dir/build_model_matshp.dat")" = 5fa5592c72147780acc22c27b78e5c5b6f9f8521
          test "$(git hash-object "$root/res/graphics/field_sprites/frame_sequences/save.bin")" = 428be0d81e3f0831dcf6ff8d671a6d05b0814abc
      - name: Compile APK
        run: gradle -p _source/pokeplatinum-pcport-source/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Platinum-Android-debug
          path: _source/pokeplatinum-pcport-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
