name: Android runtime validation
on:
  push:
    paths:
      - '.github/workflows/android-runtime-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for prepared source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            if gh api repos/${{ github.repository }}/actions/runs/35926190320/artifacts --jq '.artifacts[].name' | grep -q '^Pokemon-Platinum-Android-source$'; then exit 0; fi
            sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: Pokemon-Platinum-Android-source
          run-id: 35926190320
          github-token: ${{ github.token }}
      - name: Extract prepared source
        run: |
          unzip -q Pokemon-Platinum-Android-v0.3.0-source.zip
          # The port uses installed Gradle. SDL's unrelated sample wrapper is unused.
          rm -f pokeplatinum-android/third_party/SDL/android-project/gradle/wrapper/gradle-wrapper.jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libsdl2-dev libenet-dev pkg-config ripgrep
          python3 -m pip install --user --break-system-packages 'meson>=1.12' pillow
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: pokeplatinum-android
          key: platinum-emulator-source-35926190320-v1
      - name: Compile emulator ABI
        if: steps.native-cache.outputs.cache-hit != 'true' 
        run: gradle -p pokeplatinum-android/android assembleDebug -PandroidAbi=x86_64 --stacktrace
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: pokeplatinum-android
          key: platinum-emulator-source-35926190320-v1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and verify a rendered scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/android_smoke.sh pokeplatinum-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-results
          path: smoke-results
